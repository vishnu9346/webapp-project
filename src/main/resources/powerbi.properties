# Power BI Configuration Properties
# Replace these values with your actual Power BI application settings

# Azure AD Tenant ID
powerbi.tenant.id=your-tenant-id

# Azure AD Application (Client) ID
powerbi.client.id=your-client-id

# Azure AD Application Client Secret
powerbi.client.secret=your-client-secret

# Power BI API URLs (usually don't need to change these)
powerbi.resource.url=https://analysis.windows.net/powerbi/api
powerbi.authority.url=https://login.microsoftonline.com/
powerbi.api.url=https://api.powerbi.com/v1.0/myorg/

# Power BI Automation Settings
powerbi.automation.enabled=true
powerbi.automation.interval=300000

# Logging levels
log4j.logger.in.saidemy.webapp.powerbi=INFO